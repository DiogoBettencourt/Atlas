name: Backend

on:
  push:
    branches: [master, dev, testing_atlas_rework]
  pull_request:
  workflow_dispatch:

jobs:
  backend-build-and-test:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config Release

  # Branch protection's "required status checks" has to name every leg of
  # the matrix job above individually, and forgets about a leg silently
  # if the matrix ever changes (add an OS here, branch protection doesn't
  # know to require it until someone remembers to go update that setting
  # too). This job exists purely so there's ONE stable check name to mark
  # as required instead - it depends on every matrix leg, so it can only
  # succeed if all of them did, and picks up new matrix entries
  # automatically since `needs: backend-build-and-test` always means "the
  # whole matrix."
  #
  # Its display name ("Gate") stays distinct from the build job's matrix
  # legs ("Build (ubuntu-latest)", "Build (windows-latest)") and from
  # cli-ci.yml's "Build" job on purpose - GitHub's required-status-check
  # picker in branch protection lists checks by this display name, not by
  # workflow, so two checks sharing one name there are impossible to tell
  # apart. The matrix suffix GitHub auto-appends here is what keeps the
  # backend legs distinct from the CLI build; nothing here is named
  # identically to anything else without that kind of built-in
  # disambiguation.
  backend-ci-gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: backend-build-and-test
    if: always()
    steps:
      - name: Check backend-build-and-test result
        run: |
          if [ "${{ needs.backend-build-and-test.result }}" != "success" ]; then
            echo "backend-build-and-test did not succeed (${{ needs.backend-build-and-test.result }})"
            exit 1
          fi
