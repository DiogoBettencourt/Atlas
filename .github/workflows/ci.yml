name: CI

on:
  push:
    branches: [master, dev, testing_atlas_rework]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --build-config Release

  # Branch protection's "required status checks" has to name every leg of
  # the matrix job above individually, and forgets about a leg silently
  # if the matrix ever changes (add an OS here, branch protection doesn't
  # know to require it until someone remembers to go update that setting
  # too). This job exists purely so there's ONE stable check name
  # ("CI gate") to mark as required instead - it depends on every matrix
  # leg, so it can only succeed if all of them did, and picks up new
  # matrix entries automatically since `needs: build-and-test` always
  # means "the whole matrix."
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()
    steps:
      - name: Check build-and-test result
        run: |
          if [ "${{ needs.build-and-test.result }}" != "success" ]; then
            echo "build-and-test did not succeed (${{ needs.build-and-test.result }})"
            exit 1
          fi
