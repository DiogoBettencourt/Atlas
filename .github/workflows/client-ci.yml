name: Client

# Not path-filtered, for the same reason cli-ci.yml isn't (see the comment
# there): a workflow that never triggers leaves a check "Expected" forever.
on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  client-test:
    # Distinct display name: branch protection lists checks by this name alone.
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
