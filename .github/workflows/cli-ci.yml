name: CLI

# Deliberately NOT path-filtered at the workflow level (unlike the
# previous version of this file), even though that means every push/PR
# pays for an npm install+test cycle even on backend-only or docs-only
# changes. The reason: a workflow that never TRIGGERS on a given PR
# (because its `on.paths` didn't match) never creates a check run at
# all, and GitHub's branch protection then shows that required check as
# permanently "Expected" - stuck, not passing - for any PR that doesn't
# happen to touch packages/cli/**. That's a much worse failure mode than
# a wasted ~minute of CI time, so correctness of "required status
# checks actually clear" wins over trimming CI minutes here. (Job-level
# path filtering, which still creates a check run that just reports a
# fast no-op "skipped" success, would avoid both problems - worth
# revisiting if CI minutes become an actual cost at this project's
# scale.)
on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  cli-build-and-test:
    # "Build" with no matrix suffix - stays distinct from ci.yml's
    # matrix-suffixed "Build (ubuntu-latest)"/"Build (windows-latest)"
    # and its unsuffixed "Gate" job. GitHub's required-status-check
    # picker in branch protection lists checks by this display name
    # alone (not by workflow), so anything sharing a name with another
    # check elsewhere is impossible to tell apart there - that's the
    # thing to preserve if this ever gets renamed again.
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: packages/cli/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
